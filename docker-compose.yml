

services:
  # Elasticsearch for vector and hybrid search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: elasticsearch_rag
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO for object storage
  minio:
    image: minio/minio
    container_name: minio_rag
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - rag_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # FastAPI Application
  rag_app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    container_name: rag_app
    ports:
      - "8000:8000"
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=rag_documents
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=documents
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=tinyllama:latest
      - EMBEDDING_MODEL=BAAI/bge-m3
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - HF_TOKEN=${HF_TOKEN:-}
    depends_on:
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - rag_network
    volumes:
      - ./sample_docs:/app/sample_docs
      - hf_cache:/root/.cache/huggingface

  # Streamlit Frontend
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit_rag
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://rag_app:8000/api/v1
    depends_on:
      - rag_app
    networks:
      - rag_network

  # Kibana for Elasticsearch visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.4
    container_name: kibana_rag
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  elasticsearch_data:
  minio_data:
  hf_cache:
